[project]
name = "feast-mcp"
version = "0.1.0"
description = "Feast MCP server built on the MCP SDK"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
server = [
    "gunicorn>=21.0",
    "uvicorn>=0.25",
]
yaml = [
    "pyyaml>=6.0",
]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pymilvus>=2.4",
    "milvus-lite",
    "ruff",
    "pyarrow",
    "feast",
    "mcp",
    "PyJWT",
    "cryptography",
    "feast-mcp[otel]",
    "feast-mcp[server]"
]

[project.scripts]
feast-mcp = "feast_mcp.server:main"
